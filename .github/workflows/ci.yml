name: CI quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: Case, check, snapshot and gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --junitxml=reports/junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  evidence-integrity:
    name: Evidence snapshots match pinned commits and hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m assurance.snapshot --check

  assurance-case:
    name: Assurance case checks + broken cases that must be NO-GO
    runs-on: ubuntu-latest
    needs: [tests, evidence-integrity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Nine checks and the release decision
        run: python -m evals.run_case
      - name: Publish the decision to the job summary
        if: always()
        run: cat evals/results/release_decision.md >> "$GITHUB_STEP_SUMMARY"
      - name: Negative controls (each broken case MUST be NO-GO)
        run: |
          for v in missing-evidence broken-trace tampered-snapshot stale-evidence old-evidence weak-bound single-method prose-only unvalidated-evaluator unresolved-defeater expired-risk coverage-gap no-scope-exclusion; do
            if CASE_VARIANT=$v python -m evals.run_case --out /tmp/neg > /dev/null 2>&1; then
              echo "::error::The case gate accepted the '$v' case. The checks are broken."
              exit 1
            fi
            echo "Correctly NO-GO: $v"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-decision
          path: evals/results/
